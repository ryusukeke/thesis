name: 神戸港EDIのCSV収集

on:
  schedule:
    # UTCの22時 = 翌日の日本時間7時。GitHub側の混雑で遅れる場合がある。
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kobe-port-collection
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 非公開リポジトリであることを確認
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: 収集用ライブラリとブラウザを準備
        run: |
          python -m pip install -r port_collection/requirements.txt
          python -m playwright install --with-deps chromium

      - name: 保存済みCSVを復元
        id: restore
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin codex/kobe-port-data > /dev/null; then
            git fetch origin codex/kobe-port-data:refs/remotes/origin/codex/kobe-port-data
            git archive refs/remotes/origin/codex/kobe-port-data data/kobe_port | tar -x
          else
            result=$?
            # 2は「まだデータ用ブランチがない」。通信・認証エラーでは停止する。
            test "$result" -eq 2
          fi

      - name: ログインしてCSVを収集
        id: collect
        env:
          KOBE_EDI_ID: ${{ secrets.KOBE_EDI_ID }}
          KOBE_EDI_PASSWORD: ${{ secrets.KOBE_EDI_PASSWORD }}
        run: python port_collection/collect_port_data.py --credentials env --browser chromium --csv-only

      - name: CSVと実行記録をデータ用ブランチに保存
        # 一部の取得に失敗しても、取得できたCSVと失敗の記録は残す。
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && steps.collect.outcome != 'skipped' }}
        shell: bash
        run: |
          data_worktree="$RUNNER_TEMP/kobe-port-data"
          if git show-ref --verify --quiet refs/remotes/origin/codex/kobe-port-data; then
            git worktree add --detach "$data_worktree" refs/remotes/origin/codex/kobe-port-data
          else
            git worktree add --detach "$data_worktree" HEAD
            git -C "$data_worktree" switch --orphan codex/kobe-port-data
          fi
          mkdir -p "$data_worktree/data/kobe_port"
          if [ -d data/kobe_port/raw ]; then
            cp -R data/kobe_port/raw "$data_worktree/data/kobe_port/"
            git -C "$data_worktree" add -f -- data/kobe_port/raw
          fi
          cp data/kobe_port/last_collection.json "$data_worktree/data/kobe_port/"
          git -C "$data_worktree" add -f -- data/kobe_port/last_collection.json
          git -C "$data_worktree" -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "神戸港EDIのCSVと収集結果を保存"
          git -C "$data_worktree" push origin HEAD:refs/heads/codex/kobe-port-data
